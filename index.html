<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowora – Identify anything</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
</head><body>
<header><h1>Know<span>ora</span></h1>
<nav><button data-tab="home" class="on">Identify</button><button data-tab="history">History</button><button data-tab="quiz">Quiz me</button><button id="out" hidden>Sign out</button></nav>
<select id="lang"><option>English</option><option>Hindi</option><option>Telugu</option><option>Tamil</option><option>Spanish</option><option>French</option><option>German</option></select></header>

<main>
<section id="auth" class="card"><h2>Welcome to Knowora</h2><p>Sign in to identify anything.</p>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ chars)">
<div class="row"><button id="in">Sign in</button><button id="up" class="alt">Create account</button></div><p id="amsg" class="msg"></p></section>

<section id="home" class="tab" hidden>
<div class="hero"><h2>See something? Know everything.</h2><p>Snap, upload or search any living or non-living thing.</p>
<div class="search"><input id="q" placeholder="Search: squirrel, vacuum cleaner…"><button id="go">Search</button></div>
<div class="row"><label class="btn">📷 Take photo<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
<label class="btn alt">🖼 Upload image<input id="up-file" type="file" accept="image/*" hidden></label></div></div>
<img id="prev" hidden alt="preview"><p id="status" class="msg"></p><div id="result"></div></section>

<section id="history" class="tab" hidden><div id="hlist"></div></section>
<section id="quiz" class="tab" hidden><div id="qbox" class="card"><p>Identify something first, then come back for a quiz about it.</p></div></section>
</main>
<footer>Knowora · AI can make mistakes. Verify important details.</footer>
<script src="app.js"></script></body></html>
